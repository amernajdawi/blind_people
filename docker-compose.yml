services:
  vision-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8085:8000"
    env_file:
      - .env
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b-cloud}
      # LangSmith: set LANGCHAIN_TRACING_V2=true + LANGCHAIN_API_KEY in `.env` (env_file above).
      # Uncomment only to FORCE tracing off in the container (overrides .env):
      # LANGCHAIN_TRACING_V2: "false"
