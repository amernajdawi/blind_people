[project]
name = "camera-test-backend"
version = "0.2.0"
description = "SeeingAEye App — Gemma (Ollama) blind-assist chat, webcam vision, Google Maps grounding API"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=8.3.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "langchain>=1.2.16",
    "langchain-core>=1.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.1.10",
    "pillow==10.4.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.17",
    "uvicorn[standard]==0.32.1",
]

[tool.uv]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
